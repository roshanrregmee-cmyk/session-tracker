<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Session Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#e2e6ec;--ac:#0f766e;--pos:#15803d;--neg:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--card:#18202a;--tx:#e8edf3;--mut:#93a0b0;--bd:#2a3542;--ac:#2dd4bf;--pos:#4ade80;--neg:#f87171}}
:root[data-theme="dark"]{--bg:#0f141a;--card:#18202a;--tx:#e8edf3;--mut:#93a0b0;--bd:#2a3542;--ac:#2dd4bf;--pos:#4ade80;--neg:#f87171}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}.mut{color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 10px;white-space:nowrap}.tabs{overflow-x:auto}.row select{max-width:120px}.row input[type=checkbox]{width:22px;height:22px}.res{min-width:62px;text-align:right}
.tabs .on{border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.sc{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-weight:600;font-size:13px;vertical-align:bottom}
tfoot td{font-weight:700}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
input.c{width:78px;text-align:right}th input{font-size:12px;width:128px;display:block;margin-top:2px}
.lb{font-size:12px;color:var(--mut);min-height:16px}
.x{padding:0 6px;border:0;background:none;color:var(--mut)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row span{flex:1}.row input{width:130px;text-align:right}

.kp div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kp small{color:var(--mut)}.kp b{display:block;font-size:20px}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.pw{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}.lg{display:flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}

select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;max-width:190px}
.nogrp .bar,.nogrp .tabs,.nogrp #gbar{display:none}
.viewonly label[for=up]{opacity:.45;pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:20px;padding:5px 12px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;display:none}
</style></head><body><main>
<h1>🃏 Session Tracker</h1>
<div class="mut">Upload last time's Excel, add the new session, export. Positive = winning, negative = losing. Use different groups for different player sets.</div>
<div class="bar">
 <label class="btn pri" for="up">Upload Excel</label><input id="up" type="file" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
 <button id="xl">Export Excel</button><button id="pdf">Export Dashboard PDF</button><button id="jpg">Share as image</button>
</div>
<div class="pw" id="gbar" style="margin:0 0 10px"></div>
<div class="tabs"><button data-t="hist">History</button><button data-t="add">New session</button><button data-t="loans">Loans</button><button data-t="expenses">Expenses</button><button data-t="dash">Dashboard</button><button data-t="backup">Backups</button><button data-t="readme">Readme</button><button data-t="rules">Rules</button></div>
<div id="v"></div></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let aiFn,aiTips={},aiKey='',aiBusy=false,aiMsg='',excl={},game=null,gc=false,finals={},plays={},initLoan=500,loans=[],loanDraft={},ld=new Date().toLocaleDateString('en-CA'),hsort='desc',hpl='file',ALLP=[],PERIOD={a:0,b:-1,N:0},rf=0,rt=-1,players=[],sessions=[],draft={},tab='hist',dd=new Date().toLocaleDateString('en-CA');
const num=v=>typeof v==='number'&&isFinite(v),f=n=>num(n)?n.toLocaleString():'',cls=n=>n>0?'pos':n<0?'neg':'';
const iso2ser=d=>Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))/864e5+25569;
const ser2iso=n=>new Date(Math.round((n-25569)*864e5)).toISOString().slice(0,10);
const tot=p=>sessions.reduce((a,s)=>a+(s.v[p]||0),0),nm=(s,i)=>s.date||s.label||'Session '+(i+1);
const net=s=>players.reduce((a,p)=>a+(s.v[p]||0),0);
function sortS(){let k='';sessions=sessions.map((x,i)=>{if(x.date)k=x.date;return{x,k,i}}).sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:a.i-b.i).map(o=>o.x)}
const sOrd=a=>hsort=='desc'?[...a].reverse():a,pOrd=a=>hpl=='name'?[...a].sort((x,y)=>x.localeCompare(y)):hpl=='total'?[...a].sort((x,y)=>tot(y)-tot(x)):a;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
const avgOf=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function stats(){return players.map(p=>{const v=sessions.map(s=>s.v[p]).filter(num),t=v.reduce((a,b)=>a+b,0);return{p,t,n:v.length,w:v.filter(x=>x>0).length,l:v.filter(x=>x<0).length,aw:avgOf(v.filter(x=>x>0)),al:avgOf(v.filter(x=>x<0)),best:v.length?Math.max(...v):0,worst:v.length?Math.min(...v):0,avg:v.length?t/v.length:0}}).sort((a,b)=>b.t-a.t)}
function kpis(){const st=stats();let b=null;sessions.forEach((s,i)=>players.forEach(p=>{const x=s.v[p];if(num(x)&&(!b||x>b.x))b={p,x,n:nm(s,i)}}));
 const a=st[0],z=st[st.length-1];return[['Sessions',sessions.length,players.length+' players'],['Leader',a.p,f(a.t)],['Trailing',z.p,f(z.t)],['Best single session',b?b.p:'-',b?'+'+f(b.x)+' · '+b.n:'']]}
function render0(){
 $('#v').innerHTML=tab=='hist'?hist():tab=='add'?entry():tab=='loans'?loansTab():tab=='expenses'?expensesTab():tab=='backup'?backupTab():(tab=='readme'||tab=='rules')?notesTab(tab):dash();
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#xl').disabled=!sessions.length;$('#jpg').disabled=$('#pdf').disabled=!sessions.length||!players.length||!Object.values(sel).some(Boolean)||players.every(p=>excl[p]);upd()}
function hist(){
 if(!players.length)return'<p class="mut">No data yet. Upload your Excel, or add players in “New session”.</p>';
 const si=sOrd(sessions.map((_,i)=>i)),ps=pOrd(players),o=(v,l,c)=>`<option value="${v}" ${c==v?'selected':''}>${l}</option>`;
 let h=settleCard()+`<div class="pw" style="margin:0 0 10px"><label>Sessions <select data-hs>${o('desc','Newest first',hsort)}${o('asc','Oldest first',hsort)}</select></label><label>Players <select data-hp>${o('file','As in file',hpl)}${o('name','A–Z',hpl)}${o('total','Highest total first',hpl)}</select></label></div><div class="sc"><table><thead><tr><th>Player</th>`+si.map(i=>{const s=sessions[i];return`<th><div class="lb">${E(s.date?'':s.label||'Session '+(i+1))}<button class="x" data-del="${i}" title="Delete session">✕</button></div><input type="date" data-d="${i}" value="${s.date}"></th>`}).join('')+'<th>Total</th></tr></thead><tbody>';
 ps.forEach(p=>h+=`<tr><td>${E(p)}</td>`+si.map(i=>{const s=sessions[i];return`<td><input class="c ${cls(s.v[p])}" inputmode="decimal" data-p="${E(p)}" data-s="${i}" value="${num(s.v[p])?s.v[p]:''}"></td>`}).join('')+`<td class="${cls(tot(p))}"><b>${f(tot(p))}</b></td></tr>`);
 return h+'</tbody><tfoot><tr><td>Net</td>'+si.map(i=>`<td>${f(net(sessions[i]))}</td>`).join('')+`<td>${f(players.reduce((a,p)=>a+tot(p),0))}</td></tr></tfoot></table></div><p class="mut">Tap any cell to correct it. Blank = didn't play. Sessions are kept in date order; undated ones stay beside the session before them.</p>`}
function loanRows(P){return P.map(p=>{let bank=0,bor=0,len=0;loans.forEach(l=>{if(l.done)return;if(l.who==p){if(l.src)bor+=l.amt;else bank+=l.amt}if(l.src==p)len+=l.amt});return{p,init:initLoan,bank,bor,len,cur:initLoan+bank+bor-len}})}
const ng=n=>n?-n:0;
function loantable(P){const r=loanRows(P).map(x=>({p:x.p,i:ng(x.init),b:ng(x.bank),n:ng(x.bor-x.len),c:ng(x.cur)})),S=k=>r.reduce((a,x)=>a+x[k],0),td=v=>`<td class="${cls(v)}">${v>0?'+':''}${f(v)}</td>`;
 return'<div class="sc"><table><thead><tr><th>Player</th><th>Initial</th><th>From bank</th><th>From/to players</th><th>Current standing</th></tr></thead><tbody>'+r.map(x=>`<tr><td>${E(x.p)}</td>${td(x.i)}${td(x.b)}${td(x.n)}<td class="${cls(x.c)}"><b>${f(x.c)}</b></td></tr>`).join('')+`</tbody><tfoot><tr><td>Total</td>${td(S('i'))}${td(S('b'))}${td(S('n'))}<td>${f(S('c'))}</td></tr></tfoot></table></div>`}
function loglist(){const log=loans.map((l,i)=>({l,i})).sort((a,b)=>a.l.date<b.l.date?1:a.l.date>b.l.date?-1:b.i-a.i);
 return'<p><b>Loan log</b></p>'+(log.length?'<div class="sc"><table><tbody>'+log.map(o=>`<tr><td>${o.l.date}</td><td>${E(o.l.who)}</td><td class="${cls(ng(o.l.amt))}">${o.l.amt>0?'−':'+'}${f(Math.abs(o.l.amt))}</td><td>${o.l.amt<0?'repaid to ':'borrowed from '}${o.l.src?E(o.l.src):'Bank'}</td><td>${o.l.done?'<span class="mut">settled</span>':`<button class="x" data-ldel="${o.i}" title="Delete">✕</button>`}</td></tr>`).join('')+'</tbody></table></div>':'<p class="mut">No fresh loans yet.</p>')}
function joinCard(){const out=players.filter(p=>!game.players.includes(p));
 return`<div class="card"><b>Add a player to this game</b><div class="mut">For someone joining late. Type a new name, or pick someone who sat out. They start with the initial loan (${f(initLoan)}).</div><div class="row"><input id="jn" list="jl" placeholder="Player name" style="text-align:left;flex:1"><button id="jb">Add to game</button></div><datalist id="jl">${out.map(p=>`<option value="${E(p)}">`).join('')}</datalist></div>`}
function gcPanel(P,cur){return`<div class="card"><b>Game completion</b><div class="mut">Enter what each player finished with. Result = final amount + current standing (standing is negative while a loan is owed). Saved results go to the History tab.</div>
 ${P.map(p=>`<div class="row"><span>${E(p)} <small class="mut">(${f(ng(cur[p]))})</small></span><input inputmode="decimal" placeholder="final amount" data-fa="${E(p)}" value="${E(finals[p]===undefined?'':finals[p])}"><b class="res" data-rp="${E(p)}"></b></div>`).join('')}
 <div class="sum" id="gsum"></div><button class="pri" id="gfin" style="width:100%">Complete game &amp; save to History</button></div>`}
function loansTab(){
 if(!game)return`<div class="card"><b>No game in progress</b><p class="mut">Start one in “New session” by choosing who is playing. Loans and Game completion work on that game.</p></div>`+loglist();
 const P=game.players,cur=Object.fromEntries(loanRows(P).map(r=>[r.p,r.cur])),opts=p=>'<option value="">Bank (borrow)</option><option value="__repay" '+((loanDraft[p]||{}).src=='__repay'?'selected':'')+'>Repay bank</option>'+P.filter(q=>q!=p).map(q=>`<option value="${E(q)}" ${(loanDraft[p]||{}).src==q?'selected':''}>${E(q)}</option>`).join('');
 return`<div class="card"><label><b>Initial loan per player</b> <input type="number" data-il value="${initLoan}" style="width:110px;text-align:right"></label><div class="mut">Every player starts the game with this loan. You can change it any time; standings update.</div></div>
 ${joinCard()}
 <div class="card"><b>Fresh loan</b> <span class="mut">· game on ${game.date}</span><label style="display:block;margin:8px 0">Date <input type="date" id="ld" value="${ld}"></label>
 ${P.map(p=>`<div class="row" style="flex-wrap:wrap"><span>${E(p)}</span><input inputmode="decimal" placeholder="amount" style="width:90px" data-la="${E(p)}" value="${E((loanDraft[p]||{}).amt||'')}"><button data-lsg="${E(p)}" title="Switch + / −">±</button><select data-ls="${E(p)}">${opts(p)}</select></div>`).join('')}
 <div class="mut">Bank: adds to the player's loan. Repay bank: reduces it. Another player: the borrower's loan goes up and the lender's goes down (a negative amount does the reverse). Standing shows negative while a loan is owed.</div>
 <button class="pri" id="lsave" style="width:100%;margin-top:10px">Save fresh loans</button></div>
 <p style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b>Current standing</b><span style="display:flex;gap:6px;flex-wrap:wrap"><button id="ginvite">Copy game invite</button><button id="sxl">⬇ Export session</button><button class="pri" id="gcb">${gc?'Hide game completion':'Game completion'}</button></span></p><div class="mut" style="margin:-6px 0 8px">Copy game invite shares a link for this specific game (group + date). Export the session file as a safety copy. If this page closes, load the file from the New session tab.</div>${loantable(P)}${gc?gcPanel(P,cur):''}${loglist()}`}
function entry(){
 if(game)return`<div class="card"><b>Game in progress</b><div class="mut">${game.date} · ${game.players.length} playing: ${game.players.map(E).join(', ')}</div><p>Add loans and finish the game from the Loans tab. The final results are saved to History.</p><button class="pri" data-t="loans">Go to Loans</button> <button id="gdisc">Discard game</button></div>${joinCard()}`;
 return`<div class="card"><b>Start a new game in this group</b><div class="mut" style="margin:4px 0 8px">This group keeps one continuous history. If a completely different set of players is playing, switch to (or create) another group from the top bar.</div>
 <label>Date played <input type="date" id="nd" value="${dd}"></label>
 <div style="margin-top:10px">${players.map(p=>`<label class="row"><span>${E(p)}</span><input type="checkbox" data-pl="${E(p)}" ${plays[p]===false?'':'checked'}> Playing</label>`).join('')||'<p class="mut">Add your first player below.</p>'}</div>
 <div class="row"><input id="np" placeholder="New player name" style="text-align:left;flex:1"><button id="ap">Add player</button></div></div>
 <button class="pri" id="save" style="width:100%">Start game</button>
 <div class="card" style="margin-top:14px"><b>Resume a saved session</b><div class="mut" style="margin:4px 0 10px">If you exported your session from the Loans tab, load that file here to carry on. Upload your history Excel first so earlier sessions are kept.</div><label class="btn" for="lg">📂 Load existing session</label><input id="lg" type="file" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>`}
function upd(){const el=$('#gsum');if(!el||!game)return;const cur=Object.fromEntries(loanRows(game.players).map(r=>[r.p,r.cur]));let t=0,all=1;
 document.querySelectorAll('[data-rp]').forEach(c=>{const p=c.dataset.rp,a=parseFloat(finals[p]);if(isNaN(a)){all=0;c.textContent='';return}const r=a-cur[p];t+=r;c.textContent=(r>0?'+':'')+f(Math.round(r*100)/100);c.className='res '+cls(r)});
 t=Math.round(t*100)/100;el.className='sum '+(all&&t?'warn':'ok');el.textContent=all?(t?`Results net to ${t.toLocaleString()} (should be 0)`:'Results net to 0 ✓'):"Enter every player's final amount"}
function hbar(items,o={}){const neg=items.some(i=>i.v<0),rh=30,cx=neg?350:120,mx=Math.max(1,...items.map(i=>Math.abs(i.v))),sc=(neg?170:420)/mx,H=items.length*rh+10,fm=o.fm||f;
 let g=`<svg viewBox="0 0 600 ${H}" width="100%">`;
 items.forEach((s,i)=>{const y=i*rh+5,w=Math.abs(s.v)*sc,p=s.v>=0,c=o.c||`var(--${p?'pos':'neg'})`;g+=`<text x="0" y="${y+17}" class="t">${E(s.p)}</text><rect x="${p?cx:cx-w}" y="${y+3}" width="${w}" height="20" rx="3" fill="${c}"/><text x="${p?cx+w+6:cx-w-6}" y="${y+17}" text-anchor="${p?'start':'end'}" class="t">${fm(s.v)}</text>`});
 return g+`<line x1="${cx}" x2="${cx}" y1="0" y2="${H}" stroke="var(--bd)"/></svg>`}
const chart=st=>hbar(st.map(s=>({p:s.p,v:s.t})));
function sumtable(){const si=sOrd(sessions.map((_,i)=>i)),ps=pOrd(players);
 return'<div class="sc"><table><thead><tr><th>Player</th>'+si.map(i=>`<th style="text-align:center">${E(nm(sessions[i],i))}</th>`).join('')+'<th>Total</th></tr></thead><tbody>'+ps.map(p=>`<tr><td>${E(p)}</td>`+si.map(i=>{const v=sessions[i].v[p];return`<td class="${cls(v)}">${num(v)?f(v):'–'}</td>`}).join('')+`<td class="${cls(tot(p))}"><b>${f(tot(p))}</b></td></tr>`).join('')+'</tbody><tfoot><tr><td>Net</td>'+si.map(i=>`<td>${f(net(sessions[i]))}</td>`).join('')+`<td>${f(players.reduce((a,p)=>a+tot(p),0))}</td></tr></tfoot></table></div>`}
function recbars(st){const rh=30,mx=Math.max(1,...st.map(s=>s.n)),sc=330/mx,H=st.length*rh+10;let g=`<svg viewBox="0 0 600 ${H}" width="100%">`;
 st.forEach((s,i)=>{const y=i*rh+5,z=s.n-s.w-s.l;let x=120;g+=`<text x="0" y="${y+17}" class="t">${E(s.p)}</text>`;
  [[s.w,'var(--pos)'],[z,'#94a3b8'],[s.l,'var(--neg)']].forEach(q=>{if(q[0]){g+=`<rect x="${x}" y="${y+3}" width="${q[0]*sc}" height="20" fill="${q[1]}"/>`;x+=q[0]*sc}});
  g+=`<text x="${x+6}" y="${y+17}" class="t">${s.w}W ${z}B ${s.l}L</text>`});return g+'</svg>'}
function cols(vals){const W=600,H=260,l=50,b=30,t=15,mx=Math.max(1,...vals),step=(W-l-10)/vals.length,bw=Math.min(50,step*.7);
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${l}" x2="${W-10}" y1="${H-b}" y2="${H-b}" stroke="var(--bd)"/>`;
 vals.forEach((v,i)=>{const h=(H-b-t-15)*v/mx,x=l+step*i+(step-bw)/2;g+=`<rect x="${x}" y="${H-b-h}" width="${bw}" height="${h}" rx="3" fill="var(--ac)"/><text x="${x+bw/2}" y="${H-b-h-5}" text-anchor="middle" class="t" style="font-size:11px">${f(v)}</text><text x="${x+bw/2}" y="${H-b+16}" text-anchor="middle" class="t" style="font-size:11px">${PERIOD.idx[i]+1}</text>`});return g+'</svg>'}

const README_DEFAULT=`# Welcome
This tracker keeps your group's sessions, loans and results in one shared place. Everyone with the link sees the same data live. Use different groups when different sets of players play — each group has its own independent history.

## What each tab does
- **History**: every finished session in a table (players down, sessions across) with totals. Tap a cell to correct it, sort by newest or oldest, and delete a session with the cross (it asks for the organiser passcode if one is set).
- **New session**: choose the date and who is playing, then tap Start game. You can add a new player here, or carry on a saved game with Load existing session. For a completely different group of players, switch group from the top bar.
- **Expenses**: record shared costs such as food. Choose **who paid** and **who should share the cost**. Expenses stay completely separate from session results and only count in the settlement.
- **Loans**: works on the game in progress. Set the initial loan, record fresh loans, see the Current standing, copy a game invite, export the session, add a late joiner and finish with Game completion.
- **Dashboard**: charts and tables for any period. Open expenses appear in their own card so they stay separate from session balances.
- **Backups**: the automatic backups with restore buttons, the edit code and the organiser passcode.
- **Readme**: this page. **Rules**: your group's own rules.

## Start to finish
1. Organiser: open the app link and tap Create a new group, then Copy invite link and send it to the players. (Or open a recent group from the list.)
2. Organiser: on the Backups tab set an organiser passcode, then tap Create an edit code and share the code with the players. Without the code people can only view.
3. Players: open the link, tap Enter edit code at the top and type the code.
4. First time only: tap Upload Excel to load your old history, or start fresh by adding players in New session.
5. Start a game: New session, pick the date, tick the players who are playing and tap Start game.
6. Someone joins late: use Add a player to this game on the Loans or New session tab.
7. During the game: Loans tab, enter fresh loans. Bank adds to a player's loan, Repay bank reduces it, and choosing another player moves loan between the two. Standing shows negative while a loan is owed.
8. Share the game with late joiners: on the Loans tab tap Copy game invite (includes the group + game date). Every so often also tap Export session to keep a safety copy.
9. When the game ends: tap Game completion and enter each player's final amount. Result = final amount + current standing. The results should add up to 0.
10. Tap Complete game and save to History. The session appears in History, a backup is saved automatically, and the Settlement at the top of History shows who pays whom, using as few payments as possible, with any expenses included. Tap Share / copy to send it to the group.
11. Open the Dashboard, pick a period and players, and export a PDF or image to share.
12. After each game tap Export Excel and keep the file somewhere safe.

## Good to know
- If you see View only at the top, tap Enter edit code and type the code from the organiser.
- Upload Excel replaces the shared data for everyone, so only the organiser should use it.
- If something goes wrong, the Backups tab can restore the last completed game or the last standing.
- A blank cell means the player did not play. A 0 means they played and broke even.
- Win % counts only the sessions a player played. A 0 session counts as played but is not a win.
- To change this page, tap Edit below. Your changes are saved for everyone.

function startCloud(){if(!gid)return;
 if(!window.cloud){window.addEventListener('cloudready',startCloud,{once:true});setTimeout(()=>{if(!window.cloud){cloudErr='Could not load Google services. Check your internet connection and reload.';cs='error';render()}},15000);return}
