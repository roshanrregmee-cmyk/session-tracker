<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#e2e6ec;--ac:#0f766e;--pos:#15803d;--neg:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--card:#18202a;--tx:#e8edf3;--mut:#93a0b0;--bd:#2a3542;--ac:#2dd4bf;--pos:#4ade80;--neg:#f87171}}
:root[data-theme="dark"]{--bg:#0f141a;--card:#18202a;--tx:#e8edf3;--mut:#93a0b0;--bd:#2a3542;--ac:#2dd4bf;--pos:#4ade80;--neg:#f87171}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}.mut{color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 10px;white-space:nowrap}.tabs{overflow-x:auto}.row select{max-width:120px}.row input[type=checkbox]{width:22px;height:22px}.res{min-width:62px;text-align:right}
.tabs .on{border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.sc{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-weight:600;font-size:13px;vertical-align:bottom}
tfoot td{font-weight:700}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
input.c{width:78px;text-align:right}th input{font-size:12px;width:128px;display:block;margin-top:2px}
.lb{font-size:12px;color:var(--mut);min-height:16px}
.x{padding:0 6px;border:0;background:none;color:var(--mut)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row span{flex:1}.row input{width:130px;text-align:right}
.sum{margin:12px 0;font-weight:600}.warn{color:var(--neg)}.ok{color:var(--pos)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kp small{color:var(--mut)}.kp b{display:block;font-size:20px}
.t{fill:var(--tx);font-size:13px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.pw{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}.lg{display:flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}

select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;max-width:190px}
.nogrp .bar,.nogrp .tabs,.nogrp #gbar{display:none}
.locked .bar{opacity:.45;pointer-events:none}
.locked .bar button{pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:20px;padding:5px 12px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;display:none}
html{overscroll-behavior-y:none}body{overscroll-behavior-y:none}
#welcome{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(135deg,#ff2878,#ff9600 55%,#ffdc28);transition:opacity .5s ease,visibility .5s}
#welcome.hide{opacity:0;visibility:hidden;pointer-events:none!important}
#welcome img{width:min(46vw,200px);height:auto;border-radius:22%;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:kingIn .9s cubic-bezier(.34,1.56,.64,1) both,kingWave 1.4s ease-in-out .9s 1}
#welcome h2{margin:0;font-size:clamp(28px,8vw,44px);color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.3);animation:txtIn .6s ease .6s both}
@keyframes kingIn{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes kingWave{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes txtIn{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){#welcome img,#welcome h2{animation:none}}
#enterBtn{margin-top:8px;padding:14px 44px;font-size:20px;font-weight:700;letter-spacing:.5px;color:#ff2878;background:#fff;border:0;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.3);cursor:pointer;animation:txtIn .6s ease 1.1s both,pulse 1.6s ease-in-out 1.8s infinite}
#enterBtn:active{transform:scale(.96)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media(prefers-reduced-motion:reduce){#enterBtn{animation:none}}
/* ===== CLEAN THEME v2 ===== */
:root{--bg:#f6f1fb;--card:#fff;--tx:#1d1440;--mut:#6b5f8f;--bd:rgba(29,20,64,.12);--ac:#e9366f;--pos:#0f9d68;--neg:#e0344f;
 --g1:#ff3d81;--g2:#ff8a1f;--g3:#ffc633;--s1:#ff3d81;--s2:#2f9bff;--s3:#ffb21e;--s4:#8b5cf6;
 --page:linear-gradient(180deg,#ffeaf2 0%,#fff1e3 38%,#f1ebff 100%);--bar:rgba(247,242,252,.97);
 --sh:0 1px 2px rgba(29,20,64,.06),0 10px 26px -14px rgba(70,30,130,.32);--ring:rgba(233,54,111,.2);--zebra:rgba(233,54,111,.045);--foot:rgba(255,178,30,.14)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130a2b;--card:#201245;--tx:#f5eee3;--mut:#b4a4e0;--bd:rgba(255,255,255,.11);--ac:#ff6ea5;--pos:#3ddc9a;--neg:#ff7d92;
 --page:linear-gradient(180deg,#1b0c3d 0%,#27104f 55%,#34124a 100%);--bar:rgba(24,12,52,.97);--sh:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.7);--ring:rgba(255,110,165,.28);--zebra:rgba(255,110,165,.06);--foot:rgba(255,178,30,.12)}}
:root[data-theme="dark"]{--bg:#130a2b;--card:#201245;--tx:#f5eee3;--mut:#b4a4e0;--bd:rgba(255,255,255,.11);--ac:#ff6ea5;--pos:#3ddc9a;--neg:#ff7d92;
 --page:linear-gradient(180deg,#1b0c3d 0%,#27104f 55%,#34124a 100%);--bar:rgba(24,12,52,.97);--sh:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.7);--ring:rgba(255,110,165,.28);--zebra:rgba(255,110,165,.06);--foot:rgba(255,178,30,.12)}
html{background:var(--bg)}body{background:transparent;min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--page);pointer-events:none;transform:translateZ(0)}
*{-webkit-tap-highlight-color:transparent}
button,label,select,input,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus{outline:none}
main{padding-bottom:104px;animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
h1{font-size:23px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;min-width:0;background:linear-gradient(90deg,var(--g1),var(--g2) 60%,#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 img{box-shadow:0 2px 8px -2px rgba(70,30,130,.45)}
h1 .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
td,th,.res,.kp b,.sum{font-variant-numeric:tabular-nums}
/* buttons */
button,.btn{border:1px solid var(--bd);border-radius:999px;font-weight:600;background:var(--card);box-shadow:0 1px 2px rgba(29,20,64,.08);transition:transform .08s ease,box-shadow .12s ease,background-color .15s ease}
button:active,.btn:active{transform:scale(.97)}
.pri{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px rgba(255,61,129,.7);text-shadow:0 1px 1px rgba(0,0,0,.16)}
.x{box-shadow:none;border:0;background:none}
/* tabs */
.tabs{border-bottom:0;gap:6px;padding:2px 2px 8px}
.tabs button{border:1px solid var(--bd);border-radius:999px;background:var(--card);box-shadow:none;padding:8px 16px;transition:background-color .15s ease,color .15s ease}
.tabs .on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent;font-weight:700;box-shadow:0 6px 14px -8px rgba(255,61,129,.7)}
/* surfaces */
.card,.sc{border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh)}
.sc{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.kp div{border:1px solid var(--bd);border-left:4px solid var(--s1);border-radius:14px;box-shadow:var(--sh)}
.kp div:nth-child(4n+2){border-left-color:var(--s2)}.kp div:nth-child(4n+3){border-left-color:var(--s3)}.kp div:nth-child(4n){border-left-color:var(--s4)}
.kp b{font-weight:800;font-size:21px}
/* tables */
th{background:linear-gradient(135deg,#e8336f,#f2761a);color:#fff;border-bottom:0}
th:first-child{background:#e8336f}
th .mut,th small,th span{color:rgba(255,255,255,.92)}
tbody tr:nth-child(even) td:not(:first-child){background:var(--zebra)}
tfoot td{background:var(--foot)}tfoot td:first-child{background:var(--card)}
.pos,.neg{font-weight:700}
/* inputs */
input,select{border:1px solid var(--bd);border-radius:10px}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ring)}
.chip{border:1px solid var(--bd);box-shadow:none;font-weight:600}
#toast{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0;border-radius:999px;font-weight:600;box-shadow:0 10px 24px -10px rgba(255,61,129,.7)}
.gout{opacity:.5;filter:grayscale(1)}
/* header, status pill, sort row */
.intro{display:none}
.hd{display:flex;align-items:center;gap:8px;min-width:0}.hd h1{margin:0}
.hd .ind,.hd .rbtn{flex-shrink:0}
.ind{font-size:10px;color:var(--mut);white-space:nowrap;border:1px solid var(--bd);border-radius:999px;padding:2px 8px;background:var(--card);font-weight:600}.ind:empty{display:none}
.rbtn{width:36px;height:36px;padding:0;font-size:18px;line-height:1;border-radius:50%;font-weight:700;background:var(--card);border:1px solid var(--bd)}
.rbtn:active{transform:scale(.94)}
.srt{display:flex;gap:8px;margin:0 0 8px;font-size:12px}.srt label{flex:1;display:flex;align-items:center;gap:5px;min-width:0;margin:0}.srt select{flex:1;min-width:0;font-size:12px;padding:3px 6px}
/* join screen — centered, floating king, scroll only if needed (e.g. keyboard) */
.nogrp{overscroll-behavior:none}
body.nogrp{min-height:100dvh;min-height:100vh;touch-action:manipulation}
html.nogrp{min-height:100dvh;min-height:100vh}
body.nogrp main{padding:12px 0 24px!important;margin:0!important;max-width:none;min-height:100dvh;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-sizing:border-box}
body.nogrp .topbar{position:static;margin:0;padding:0;background:transparent;border:0;box-shadow:none;width:100%;display:flex;flex-direction:column;align-items:center}
body.nogrp .intro,.nogrp .intro{display:none!important}
.nogrp .hd{justify-content:center;margin:0;padding:0}
.nogrp h1{
  justify-content:center;margin:0 0 8px;padding:0;position:relative;z-index:2;
  background:none!important;-webkit-background-clip:unset!important;background-clip:unset!important;color:var(--tx)!important;
}
.nogrp h1 .ttl{display:none}
.nogrp h1 img{
  height:min(34vw,132px)!important;width:min(34vw,132px)!important;margin:0!important;
  border-radius:28%;
  box-shadow:0 18px 40px -10px rgba(255,61,129,.55),0 8px 20px -8px rgba(255,138,31,.4);
  animation:kingFloat 3.2s ease-in-out infinite,kingGlow 2.4s ease-in-out infinite alternate;
  transform-origin:50% 60%;
  will-change:transform;
}
@keyframes kingFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  40%{transform:translateY(-14px) rotate(3deg)}
  70%{transform:translateY(-6px) rotate(-1deg)}
}
@keyframes kingGlow{
  from{filter:drop-shadow(0 0 0 rgba(255,61,129,0))}
  to{filter:drop-shadow(0 0 18px rgba(255,110,165,.55))}
}
@media(prefers-reduced-motion:reduce){
  .nogrp h1 img{animation:none}
}
.nogrp #v{width:100%;max-width:420px;padding:0 20px;box-sizing:border-box;position:relative;z-index:2}
.jn{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:stretch;position:relative;z-index:3;width:100%}
.jn .jn-title{color:var(--ac)} /* fallback if background-clip unsupported */
.jn .jn-title{
  text-align:center;font-size:clamp(22px,6vw,30px);font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--g1),var(--g2) 55%,#c026d3);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin:4px 0 2px;line-height:1.15
}
.jn .jn-sub{text-align:center;color:var(--mut);font-size:14px;margin:0 0 4px;font-weight:500}
.jn input{
  width:100%;padding:16px 18px;font-size:17px;text-align:center;letter-spacing:.04em;
  border-radius:18px;background:var(--card);border:2px solid transparent;
  box-shadow:var(--sh),0 0 0 1px var(--bd);font-weight:600;
  transition:box-shadow .15s,border-color .15s,transform .1s
}
.jn input:focus{
  outline:none;border-color:var(--ac);
  box-shadow:0 0 0 4px var(--ring),var(--sh)
}
.jn input::placeholder{font-weight:500;letter-spacing:0;opacity:.7}
.jn button{padding:15px 18px;font-size:16px;border-radius:999px;font-weight:700}
.jn .pri{
  background:linear-gradient(135deg,var(--g1),var(--g2) 60%,#ffb21e);
  border:0;color:#fff;box-shadow:0 10px 28px -10px rgba(255,61,129,.75);
  text-shadow:0 1px 1px rgba(0,0,0,.18);letter-spacing:.02em
}
.jn .pri:active{transform:scale(.97)}
.jn #gadminlogin,.jn #gback{
  background:rgba(255,255,255,.55);backdrop-filter:blur(8px);
  border:1px solid var(--bd);color:var(--tx)
}
:root[data-theme="dark"] .jn #gadminlogin,:root[data-theme="dark"] .jn #gback{background:rgba(32,18,69,.65)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .jn #gadminlogin,:root:not([data-theme="light"]) .jn #gback{background:rgba(32,18,69,.65)}}
.jn .jn-or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.jn .jn-refresh{margin-top:4px;background:var(--card);border:1px dashed var(--bd);color:var(--tx);font-weight:600;box-shadow:none}
.jn .jn-refresh:active{transform:scale(.97)}
/* refresh stays visible on join */
.jn .jn-or::before,.jn .jn-or::after{content:"";flex:1;height:1px;background:var(--bd)}
.grow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.grow small{display:block}
/* funky ambient blobs on join only */
body.nogrp main::before,body.nogrp main::after{
  content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(40px);opacity:.55
}
body.nogrp main::before{
  width:min(70vw,320px);height:min(70vw,320px);
  top:-8%;right:-12%;
  background:radial-gradient(circle at 30% 30%,#ff3d81,transparent 70%)
}
body.nogrp main::after{
  width:min(60vw,280px);height:min(60vw,280px);
  bottom:5%;left:-15%;
  background:radial-gradient(circle at 70% 40%,#ffb21e,transparent 70%)
}
body.nogrp .topbar::after{
  content:"";position:fixed;width:min(50vw,220px);height:min(50vw,220px);
  top:42%;left:50%;transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,#8b5cf6 0%,transparent 70%);
  opacity:.25;filter:blur(30px)
}
/* dashboard tools */
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;font-weight:600;font-size:14px;box-shadow:var(--sh);cursor:pointer;text-align:center}
.tool i{font-style:normal;font-size:26px}
@media(min-width:640px){.tools{grid-template-columns:repeat(4,1fr)}}
/* floating king + side menu */
#fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:8000;width:58px;height:58px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--card);box-shadow:0 10px 24px -8px rgba(40,10,90,.6);overflow:hidden;cursor:pointer}
#fab img{width:100%;height:100%;display:block;object-fit:cover}
#scrim{position:fixed;inset:0;z-index:8500;background:rgba(20,5,50,.45);opacity:0;pointer-events:none;transition:opacity .25s}
#drawer{position:fixed;top:0;right:0;bottom:0;z-index:8600;width:min(78vw,300px);background:var(--card);border-left:1px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 24px;transform:translateX(105%);visibility:hidden;transition:transform .28s cubic-bezier(.3,.8,.3,1),visibility 0s .28s;overflow-y:auto;will-change:transform}
body.dopen #drawer{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.3,.8,.3,1);box-shadow:-12px 0 36px -10px rgba(0,0,0,.45)}
body.dopen #scrim{opacity:1;pointer-events:auto}
#drawer .dh{display:flex;align-items:center;gap:10px;margin-bottom:18px}
#drawer .dh img{width:44px;height:44px;border-radius:22%}
#drawer .dh b{display:block;font-size:17px;word-break:break-word}#drawer .dh small{display:block}
#gbar{gap:6px;font-size:13px}
#drawer #gbar{display:flex;flex-direction:column;gap:10px;font-size:15px}
#drawer #gbar button{width:100%;font-size:15px;padding:12px 16px;text-align:left}
.nogrp #drawer,.nogrp #scrim,.nogrp .ind{display:none}
body.adminon #fab{display:none}
@media(prefers-reduced-motion:reduce){#drawer,#scrim,main{transition:none;animation:none}}
#v{/* transitions disabled for stability */}
#v.v-show{opacity:1;transform:none}
/* ===== App hub (Cards / Expenses / Feed) ===== */
body.mode-hub .tabs,body.mode-hub .intro,body.mode-hub .bar{display:none!important}
body.mode-bills .tabs,body.mode-bills .intro{display:none!important}
body.mode-rsvp .tabs,body.mode-rsvp .intro{display:none!important}
body.mode-chips .tabs,body.mode-chips .intro{display:none!important}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0 12px;max-width:720px;margin-left:auto;margin-right:auto}

function chipsOverlap(aFrom,aTo,bFrom,bTo){
  if(!aFrom||!aTo||!bFrom||!bTo)return false;
  return aFrom<=bTo && bFrom<=aTo;
}
function chipsCurrent(list, today){
  const t=today||new Date().toLocaleDateString('en-CA');
  const active=(list||[]).filter(b=>b.from&&b.to&&b.from<=t&&t<=b.to);
  if(!active.length)return null;
  active.sort((a,b)=>(b.at||0)-(a.at||0));
  return active[0];
}
function chipsCalMonth(list, year, month){
  /* month 0-based; return HTML for month grid */
  const first=new Date(year,month,1);
  const startDow=(first.getDay()+6)%7; /* Mon=0 */
  const daysIn=new Date(year,month+1,0).getDate();

  const monName=first.toLocaleString('en',{month:'long',year:'numeric'});

    <button type="button" data-chcal="-1" style="padding:6px 12px">‹</button>

    <button type="button" data-chcal="1" style="padding:6px 12px">›</button>

    h+=`<div title="${E(title||iso)}" style="padding:6px 2px;border-radius:8px;background:${bg};color:${fg};font-weight:${isToday||hits.length?700:500};min-height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15">

async function xgrpFetch(){
 if(!canOrganise())return toast('Admin only');
 const codes=Object.keys(xgrp.picked).filter(k=>xgrp.picked[k]&&k!==gid);
 if(!codes.length)return toast('Select at least one other group');
 xgrp.busy=true;xgrp.err='';xgrp.combined=null;render();
 try{
  if(!window.cloud||!cloud.getState)throw new Error('Not connected');
  for(const code of codes){
   const raw=await cloud.getState(code);
   let S=EMPTY();
   if(raw&&raw.json&&raw.json!=='null'){try{S=norm(JSON.parse(raw.json))}catch(e){throw new Error('Bad data in '+(code.slice(0,8)))}}
   const meta=(xgrp.list||[]).find(g=>g.code===code)||{code,name:code.slice(0,8)};
   xgrp.data[code]={name:meta.name||code.slice(0,8),sessions:S.sessions||[],players:S.players||[]};
  }
  xgrp.combined=xgrpBuildCombined(codes);
  xgrp.busy=false;render();
  toast('Combined '+codes.length+' group(s)');
 }catch(e){xgrp.busy=false;xgrp.err=(e&&e.message)||'Fetch failed';render()}
}
function xgrpTot(sess,name){
 const k=nkey(name);let t=0;
 (sess||[]).forEach(s=>{
  const v=s.v||{};
  Object.keys(v).forEach(p=>{if(nkey(p)===k&&num(v[p]))t+=v[p]});
 });
 return Math.round(t*100)/100;
}
function xgrpBuildCombined(codes){
 const groups=codes.map(code=>({code,name:(xgrp.data[code]&&xgrp.data[code].name)||code.slice(0,8)}));
 const nameMap={}; // key -> display name prefer current group
 players.forEach(p=>{nameMap[nkey(p)]=p});
 codes.forEach(code=>{(xgrp.data[code].players||[]).forEach(p=>{const k=nkey(p);if(!nameMap[k])nameMap[k]=p})});
 // also names only appearing in sessions
 const addFrom=sess=>{(sess||[]).forEach(s=>Object.keys(s.v||{}).forEach(p=>{const k=nkey(p);if(!nameMap[k])nameMap[k]=p}))};
 addFrom(sessions);codes.forEach(code=>addFrom(xgrp.data[code].sessions));
 const rows=Object.keys(nameMap).map(k=>{
  const display=nameMap[k];
  const here=xgrpTot(sessions,display);
  const by={};let total=here;
  codes.forEach(code=>{const v=xgrpTot(xgrp.data[code].sessions,display);by[code]=v;total=Math.round((total+v)*100)/100});
  return{key:k,display,here,by,total};
 }).filter(r=>r.here||Object.values(r.by).some(v=>v)).sort((a,b)=>b.total-a.total);
 return{groups,rows};
}
function xgrpImport(){
 if(!canOrganise())return toast('Admin only');
 if(!xgrp.combined)return;
 const codes=xgrp.combined.groups.map(g=>g.code);
 if(!codes.length)return;
 if(!confirm('Copy sessions from '+codes.length+' group(s) into this group\'s History? Existing sessions stay. Players will be added if missing.'))return;
 let added=0;
 codes.forEach(code=>{
  const d=xgrp.data[code];if(!d)return;
  const tag=(d.name||code.slice(0,8)).slice(0,20);
  (d.players||[]).forEach(p=>{if(p&&!players.some(q=>nkey(q)===nkey(p)))players.push(p)});
  (d.sessions||[]).forEach(s=>{
   const v={};Object.keys(s.v||{}).forEach(p=>{if(num(s.v[p]))v[p]=s.v[p]});
   // map keys to local player names when case differs
   const v2={};
   Object.keys(v).forEach(p=>{
    const local=players.find(q=>nkey(q)===nkey(p))||p;
    v2[local]=v[p];
   });
   sessions.push({id:uid(),date:s.date||'',label:(s.label?s.label+' · ':'')+tag,v:v2});
   added++;
  });
 });
 sortS();render();toast('Imported '+added+' session(s)');
}

async function adminLogin(){

async function issueEmailOtp(email){
 const e=normEmail(email);
 await loadEmailUsers();
 const u=findEmailUser(e);
 if(!u)throw new Error('Email not registered. Ask your admin to add you.');
 const otp=String(Math.floor(100000+Math.random()*900000));
 const salt=randHex(16),iter=120000;
 const hash=await hashPass(otp,salt,iter);
 u.otpSalt=salt;u.otpIter=iter;u.otpHash=hash;u.otpExp=Date.now()+15*60*1000;u.pendingOtp=otp;
 await saveEmailUsers(emailUsers);
 return otp;
}
async function emailContinue(){
 if(!(await ensureCloud()))return toast('Could not connect');
 const email=normEmail(($('#eu_email')&&$('#eu_email').value)||'');
 const pass=(($('#eu_pass')&&$('#eu_pass').value)||'');
 if(!email||!email.includes('@'))return toast('Enter a valid email');
 await loadEmailUsers();
 let u=findEmailUser(email);
 if(!u)return toast('Email not registered. Ask your admin to add your email first.');
 if(u.passHash&&u.passSalt){
  if(!pass)return toast('Enter your password');
  const h=await hashPass(pass,u.passSalt,u.passIter||150000);
  if(h!==u.passHash)return toast('Wrong password');
  const remember=!!($('#eu_remember')&&$('#eu_remember').checked);
  try{
   if(remember)localStorage.setItem('ptc_email_remember',JSON.stringify({email,pass}));
   else localStorage.removeItem('ptc_email_remember');
  }catch(e){}
  saveEmailSession({email:u.email,name:u.name||'',groups:u.groups||[]});
  emailAuthMode='';emailOtpPending=null;
  try{adminGroups=await loadGroupList()}catch(e){}
  toast('Signed in');render();return;
 }
 // First-time: OTP flow
 try{
  await issueEmailOtp(email);
  emailOtpPending=email;emailAuthMode='otp';
  toast('OTP created — check with your admin for the code (shown in Email registrations)');
  render();
 }catch(e){toast(e.message||'Could not start verification')}
}
async function emailVerifyOtp(){
 const otp=(($('#eu_otp')&&$('#eu_otp').value)||'').trim();
 if(!otp||!emailOtpPending)return toast('Enter the OTP');
 await loadEmailUsers();
 const u=findEmailUser(emailOtpPending);
 if(!u||!u.otpHash)return toast('No OTP pending — go back and try again');
 if(u.otpExp&&Date.now()>u.otpExp)return toast('OTP expired — request a new one');
 const h=await hashPass(otp,u.otpSalt,u.otpIter||120000);
 if(h!==u.otpHash)return toast('Wrong OTP');
 emailAuthMode='setpass';render();
}

function reconcile(S){base=norm(S);lastSent='';try{if(canon(getState())!==canon(base)){applying=true;try{applyState(base)}catch(e){console.error(e)}applying=false;renderSafe()}}catch(e){console.error('reconcile',e);applying=false;renderSafe()}setSync(navigator.onLine===false?'offline':'live')}
async function persistEvents(){
 /* Allow anyone with group access (including view-only) to create/RSVP events */
 if(!cloudOn||!synced||applying||!window.cloud||!gid)return;
 let L;try{L=getState()}catch(e){console.error(e);return}
 const B=base||EMPTY();
 // Keep all other fields from base; only push events from local
 const payload={...B,events:(L.events||[]).map(ev=>({id:ev.id,msg:ev.msg||'',date:ev.date||'',timeFrom:ev.timeFrom||'',timeTo:ev.timeTo||'',food:!!ev.food,at:ev.at||0,by:ev.by||'',rsvps:Array.isArray(ev.rsvps)?ev.rsvps.map(r=>({name:r.name||'',status:r.status||'yes',foodPref:r.foodPref||'',at:r.at||0})):[]}))};
 const c=canon(payload);if(c===canon(B)||c===lastSent)return;
 lastSent=c;inflight++;setSync('saving');
 try{
  const out=await cloud.commit(gid,rj=>{
   const remote=rj?JSON.parse(rj):EMPTY();
   const remE=Array.isArray(remote.events)?remote.events:[];
   const locE=Array.isArray(payload.events)?payload.events:[];
   const byId=new Map();
   remE.forEach(e=>{if(e&&e.id)byId.set(e.id,{...e,rsvps:Array.isArray(e.rsvps)?e.rsvps.map(r=>({...r})):[]})});
   locE.forEach(e=>{
    if(!e||!e.id)return;
    if(!byId.has(e.id)){byId.set(e.id,{...e,rsvps:Array.isArray(e.rsvps)?e.rsvps.map(r=>({...r})):[]});return}
    const cur=byId.get(e.id);
    // Local may have deleted — if missing from loc entirely we keep remote (handled by locE loop only updating present ids)
    // Merge rsvps by name (case-insensitive), newer at wins
    const rmap=new Map();
    (cur.rsvps||[]).forEach(r=>{if(r&&r.name)rmap.set(String(r.name).toLowerCase(),{...r})});
    (e.rsvps||[]).forEach(r=>{
     if(!r||!r.name)return;
     const k=String(r.name).toLowerCase();
     const prev=rmap.get(k);
     if(!prev||(r.at||0)>=(prev.at||0))rmap.set(k,{name:r.name,status:r.status||'yes',foodPref:r.foodPref||'',at:r.at||0});
    });
    cur.rsvps=[...rmap.values()];
    // Prefer local msg/date if local is newer
    if((e.at||0)>=(cur.at||0)){cur.msg=e.msg||cur.msg;cur.date=e.date||cur.date;cur.timeFrom=e.timeFrom||cur.timeFrom||'';cur.timeTo=e.timeTo||cur.timeTo||'';cur.food=!!e.food;cur.at=e.at||cur.at;cur.by=e.by||cur.by}
   });
   // Deletions: if editor deleted, local list is missing that id vs base
   const baseIds=new Set((B.events||[]).map(e=>e.id));
   const locIds=new Set(locE.map(e=>e.id));
   baseIds.forEach(id=>{if(!locIds.has(id))byId.delete(id)});
   const merged={...remote,events:[...byId.values()]};
   return JSON.stringify(merged);
  });
  base=norm(JSON.parse(out));
  applying=true;try{applyState(base)}catch(e){console.error(e)}applying=false;
  cs=navigator.onLine===false?'offline':'live';setSync(cs);
 }catch(e){console.error('persistEvents',e);cs='error';setSync(cs);toast('Could not save RSVP — check connection')}
 finally{inflight=Math.max(0,inflight-1);if(!inflight&&cs==='saving')setSync(navigator.onLine===false?'offline':'live')}
}

const RULES_DEFAULT=`# Teen Patti House Rules

## How to Play
- Standard **52-card** deck
- Each player is dealt **3 cards face-down** (until there is a variation game)
- Players can play **Blind** (without seeing cards) a maximum of **2 times**. **Seen** players (after looking at cards) have **no limit**
- Betting starts with **ante (boot)**, then rounds of raising or packing

## Hand Rankings (Highest to Lowest)
1. **Trail / Trio** (Three of a Kind) — e.g. A♠ A♥ A♦ — Highest
2. **Pure Sequence** (Straight Flush) — e.g. A♠ K♠ Q♠
3. **Sequence** (Straight) — e.g. A♥ K♦ Q♣
4. **Colour** (Flush) — e.g. K♠ 9♠ 5♠
5. **Pair** (Two of a Kind) — e.g. Q♥ Q♦ 8♣
6. **High Card** — e.g. K♥ 9♠ 4♦ — Lowest

## Suit Ranking (Highest to Lowest)
1. **Spade** (Black)
2. **Heart** (Red)
3. **Diamond** (Red)
4. **Club** (Black)

## Key Rules
- Blind player bets **1x**, Seen player bets **2x** the current stake
- Maximum **2x raises** per round, with a limit of **80 (Blind) / 160 (Seen)**
- **Showdown**: highest ranking hand wins the pot
- If only **2 players** remain and one is Blind, the other must put **2x** to request a **Show**

---
Tap **Edit** below to change these rules for your group. Changes are saved for everyone.
`;
const README_DEFAULT=`# Welcome
This tracker keeps your group's sessions, loans and results in one shared place. Everyone with the link sees the same data live. Use **different groups** when different sets of players play — each group has its own independent history and can be named.

## Access
- **Group Code**: opens a group. Anyone with it can view.
- **Password**: required to record games, loans and expenses. Without it you can only view.
- **Admin**: asked for to create groups, edit History, upload Excel, delete data and restore backups. Tap **Admin** on the first screen to see all groups.

## What each tab does
- **History**: finished sessions in a table (players down, sessions across) with totals. **View-only for everyone except the admin.** Organisers can edit cells, change dates and delete sessions (admin password). Sort by newest/oldest.
- **New session**: pick the date and who is playing, then Start game. Add players, delete players from the roster (admin password), or resume a saved session file. Use another group for a different set of players (Switch group).
- **Expenses**: shared costs (food, etc.). Choose **who paid** and **who should share the cost**. Expenses never mix into History or Dashboard totals; they only affect settlement when the game is completed.
- **Loans**: for the game in progress. Set initial loan, record fresh loans, see Current standing, **Copy game invite**, export the session, add or **remove a player from this game**, then Game completion.
- **Dashboard**: charts and stats for any period. Open expenses show in their own card. Export PDF or image.
- **Backups**: automatic full/standing backups, password, admin password, and **All groups (admin)** — open or permanently delete any registered group.
- **Readme**: this page. **Rules**: Teen Patti house rules by default (editable).

## Start to finish
1. Admin: tap **Admin**, enter the admin password, then **New group** (optionally set a Password), then Copy Group Code.
2. Players: enter the Group Code on the first screen. To play, enter the **Password**.
3. Start a game: New session → date → tick players → Start game.
4. Late joiner: Add a player on Loans or New session. To drop someone mid-game: Remove on Loans.
6. During the game: Loans — Bank / Repay bank / player-to-player. Standing is negative while a loan is owed. Copy game invite or Export session for safety.
7. End: Game completion → each player's final amount → Complete game. Settlement appears at the top of History (includes expenses).
8. Dashboard: pick period and players, export PDF or image. Export Excel after games if you want a file backup.
9. Organiser only: Upload Excel (top bar) replaces all shared history — asks for admin password.

## Groups and admin
- **Switch group** / Recent groups: move between independent tables on this device.
- **Rename** a group with the ✎ next to the group name (needs edit access).
- **All groups (admin)** on Backups: after admin password, list every registered group, open any of them, or **delete** a group (history, loans, expenses and backups — permanent).
- Creating a group always needs the **same admin password** used across the app.

## Good to know
- Locked group: no view of data, no export/upload, until view code or admin password is entered.
- History is read-only unless the admin unlocks it on that device.
- Upload Excel is **organiser-only** and overwrites the whole group.
- Blank cell = did not play. 0 = played and broke even.
- Win % counts only sessions a player played.
- Rules tab ships with Teen Patti house rules; edit anytime.
- To change this Readme, tap Edit below. Saved for everyone.

function minTransfers(bal){const items=bal.filter(x=>x.b!==0),n=items.length;if(!n)return[];let groups;

async function checkAppUpdate(){

    let reg=await navigator.serviceWorker.getRegistration();
    if(!reg){try{reg=await navigator.serviceWorker.register('./sw.js')}catch(e){return{updated:false,reason:'reg-fail'}}}

    try{await reg.update()}catch(e){}
    const waiting=reg.waiting||(reg.installing&&null);
    if(reg.waiting){
      return await new Promise(resolve=>{
        let done=false;
        const finish=()=>{if(done)return;done=true;resolve({updated:true,reason:'new-sw'})};
        navigator.serviceWorker.addEventListener('controllerchange',()=>{finish();window.location.reload()}, {once:true});
        try{reg.waiting.postMessage({type:'SKIP_WAITING'})}catch(e){}
        setTimeout(()=>{if(!done){done=true;try{caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).finally(()=>location.reload())}catch(e){location.reload()}resolve({updated:true,reason:'timeout-reload'})}},2500);

    }

    try{
      const res=await fetch('./sw.js?_=' + Date.now(),{cache:'no-store'});
      if(res&&res.ok){
        const text=await res.text();
        const mNew=(text.match(/session-tracker-v\d+/)||[])[0];
        if(mNew&&mNew!==CACHE_HINT){
          if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}

        }

    return{updated:false,reason:hadWaiting?'activated':'latest'};
  }catch(e){return{updated:false,reason:String(e&&e.message||e)}}
}
